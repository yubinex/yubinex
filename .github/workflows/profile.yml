name: Static lab dossier

on:
  workflow_dispatch:
  schedule:
    - cron: '29 5 * * *'
  push:
    paths:
      - README.md
      - .github/profile-data.json
      - assets/lab-*.svg
      - .github/workflows/profile.yml
      - .github/scripts/**
  pull_request:
    paths:
      - README.md
      - .github/profile-data.json
      - assets/lab-*.svg
      - .github/workflows/profile.yml
      - .github/scripts/**

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check static profile and payload budgets
        run: python3 -m unittest discover -s .github/scripts -p 'test_static_profile.py'

  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: lab-dossier-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refresh public snapshot and generate static dossier
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/static_profile.py --refresh
      - name: Check artwork and transcript
        run: python3 -m unittest discover -s .github/scripts -p 'test_static_profile.py'
      - name: Save refreshed dossier
        run: |
          git add README.md assets/lab-*.svg .github/profile-data.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh static lab dossier'
          git push
